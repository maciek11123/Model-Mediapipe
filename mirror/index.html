<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bluey Mirror</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;touch-action:none;user-select:none}
canvas#three{position:fixed;inset:0;width:100%!important;height:100%!important}
video#cam{position:fixed;bottom:12px;right:12px;width:120px;height:90px;border-radius:10px;border:2px solid rgba(255,255,255,.25);object-fit:cover;transform:scaleX(-1);z-index:20;opacity:.85}
@media(max-width:600px){video#cam{width:80px;height:60px;bottom:8px;right:8px}}
#charBar{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;padding:10px 12px;z-index:20;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#charBar::-webkit-scrollbar{display:none}
.char-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.char-btn.active{background:rgba(100,180,255,.5);border-color:rgba(100,180,255,.7)}
.char-btn:active{transform:scale(.93)}
#status{position:fixed;bottom:12px;left:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);color:#aaa;padding:6px 14px;border-radius:8px;font-size:12px;z-index:20}
#status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
#status .dot.on{background:#4CAF50}
#status .dot.off{background:#e53935}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;z-index:100;gap:12px;font-size:18px;font-weight:600}
#loading .sub{font-size:13px;color:#888;font-weight:400}
#gestureLabel{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(100,180,255,.4);backdrop-filter:blur(8px);color:#fff;padding:6px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
#gestureLabel.show{opacity:1}
</style>
</head>
<body>

<div id="loading">
  <div>Loading Bluey Mirror...</div>
  <div class="sub" id="loadMsg">Initializing camera...</div>
</div>

<div id="charBar">
  <button class="char-btn active" data-file="Bluey_fixed_1.glb">Bluey</button>
  <button class="char-btn" data-file="Bingo_fixed_1.glb">Bingo</button>
  <button class="char-btn" data-file="kuromi_fixed_1.glb">Kuromi</button>
  <button class="char-btn" data-file="Pompompurin_fixed_1.glb">Pompompurin</button>
</div>

<canvas id="three"></canvas>
<video id="cam" autoplay playsinline muted></video>
<div id="status"><span class="dot off"></span>Camera off</div>
<div id="gestureLabel"></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RigCharacter, CLIPS } from './rig_engine.js';
import { applyCalibration } from './apply_calibration.js';

// ── add extra clips ──
CLIPS.laugh = function(rig, t, { intensity = 1 } = {}) {
    const s = rig.semantic, shake = Math.sin(t * 12) * 0.04 * intensity;
    if (s.spine[0]) rig.pose(s.spine[0], -0.15 * intensity + shake, 0, 0);
    rig.pose(s.head, -0.2 * intensity + shake * 1.5, 0, Math.sin(t * 6) * 0.05);
    const ad = rig.armDownAuto ?? 1.4;
    rig.pose(s.upperArmL, shake * 2, 0, -ad);
    rig.pose(s.upperArmR, shake * 2, 0, ad);
    rig.poseLocal(s.forearmL, 0.5 + Math.abs(shake) * 3, 0, 0);
    rig.poseLocal(s.forearmR, 0.5 + Math.abs(shake) * 3, 0, 0);
    rig.morph('Mouth Smile', 0.9); rig.viseme('A', 0.4 + Math.sin(t * 8) * 0.3);
    rig.blink(0.3 + Math.sin(t * 10) * 0.1); rig.morph('BrowHappy', 0.8);
    rig._driveHips(-0.01 * intensity + shake * 0.5, 0, 0);
    s.tail.forEach((n, i) => rig.pose(n, 0, Math.sin(t * 8 - i * 0.5) * 0.15, 0));
};
CLIPS.excited = function(rig, t, { intensity = 1 } = {}) {
    const s = rig.semantic, bounce = Math.abs(Math.sin(t * 8)) * intensity;
    rig._driveHips(bounce * 0.03, 0, 0);
    if (s.spine[0]) rig.pose(s.spine[0], -bounce * 0.08, 0, 0);
    rig.pose(s.head, -0.1 + bounce * 0.05, Math.sin(t * 4) * 0.1, 0);
    rig.pose(s.upperArmL, -0.3, 0, -0.3 + Math.sin(t * 6) * 0.4);
    rig.pose(s.upperArmR, -0.3, 0, 0.3 - Math.sin(t * 6) * 0.4);
    rig.poseLocal(s.forearmL, 1.0 + bounce * 0.3, 0, 0);
    rig.poseLocal(s.forearmR, 1.0 + bounce * 0.3, 0, 0);
    rig.collision?.suppress(0.2);
    rig.morph('Mouth Smile', 1.0); rig.viseme('A', bounce * 0.5);
    rig.morph('BrowHappy', 0.9); rig.blink(0);
    rig.pose(s.thighL, -bounce * 0.15, 0, 0); rig.pose(s.thighR, -bounce * 0.15, 0, 0);
    rig._poseMapped(s.shinL, rig.legAxes?.kneeL, bounce * 0.3 + 0.1);
    rig._poseMapped(s.shinR, rig.legAxes?.kneeR, bounce * 0.3 + 0.1);
    s.tail.forEach((n, i) => rig.pose(n, 0, Math.sin(t * 10 - i * 0.3) * 0.2, 0));
};

// ── constants ──
const MODEL_DIR = '../models/';
const CHARS = [
    { file: 'Bluey_fixed_1.glb', name: 'Bluey' },
    { file: 'Bingo_fixed_1.glb', name: 'Bingo' },
    { file: 'kuromi_fixed_1.glb', name: 'Kuromi' },
    { file: 'Pompompurin_fixed_1.glb', name: 'Pompompurin' },
];

// ── three.js ──
const threeCanvas = document.getElementById('three');
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8d8f0);
scene.fog = new THREE.FogExp2(0xa8d8f0, 0.015);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 2.2, 5.5);
camera.lookAt(0, 1.0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 10;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI / 2.1;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0xe8ddd0, 1.2));
const sun = new THREE.DirectionalLight(0xfffaf2, 1.6);
sun.position.set(4, 8, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = sun.shadow.camera.bottom = -5;
sun.shadow.camera.right = sun.shadow.camera.top = 5;
sun.shadow.bias = -0.002;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0xd8e8ff, 0.5).translateX(-3).translateY(2).translateZ(-3));

// ground
const groundGeo = new THREE.CircleGeometry(8, 64);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x7abb5e, roughness: 0.95 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ── model loading ──
const gltfLoader = new GLTFLoader();
let rig = null, model = null;

async function loadCharacter(file) {
    const msg = document.getElementById('loadMsg');
    const loading = document.getElementById('loading');
    loading.style.display = 'flex';
    msg.textContent = `Loading ${file}...`;
    try {
        const gltf = await gltfLoader.loadAsync(MODEL_DIR + encodeURIComponent(file));
        if (model) { model.traverse(c => { if (c.geometry) c.geometry.dispose(); }); scene.remove(model); }
        model = gltf.scene;
        model.traverse(c => { if (c.isMesh) c.castShadow = true; });
        RigCharacter.normalize(model, THREE, 2.2);
        scene.add(model);
        rig = new RigCharacter(model, THREE, { smoothing: 10 });
        applyCalibration(gltf, rig);
        rig.play('idle');
        loading.style.display = 'none';
        document.querySelectorAll('.char-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.file === file));
    } catch (e) {
        console.error(e);
        msg.textContent = `Failed: ${e.message}`;
    }
}

document.querySelectorAll('.char-btn').forEach(b =>
    b.addEventListener('click', () => loadCharacter(b.dataset.file)));

// ── camera setup ──
const video = document.getElementById('cam');
const statusEl = document.getElementById('status');
let camReady = false;

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });
        video.srcObject = stream;
        await video.play();
        camReady = true;
        statusEl.innerHTML = '<span class="dot on"></span>Camera active';
        return true;
    } catch (e) {
        console.warn('Camera failed:', e);
        statusEl.innerHTML = '<span class="dot off"></span>No camera — idle mode';
        return false;
    }
}

// ── MediaPipe ──
let poseLandmarker = null, faceLandmarker = null;
let latestPose = null, latestFace = null;
let mpReady = false;

async function initMediaPipe() {
    document.getElementById('loadMsg').textContent = 'Loading MediaPipe...';
    try {
        const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs');
        const { PoseLandmarker, FaceLandmarker, FilesetResolver } = vision;
        const filesetResolver = await FilesetResolver.forVisionTasks(
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm'
        );
        poseLandmarker = await PoseLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
                modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
                delegate: 'GPU'
            },
            runningMode: 'VIDEO',
            numPoses: 1
        });
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
                modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
                delegate: 'GPU'
            },
            runningMode: 'VIDEO',
            numFaces: 1,
            outputFaceBlendshapes: true
        });
        mpReady = true;
        statusEl.innerHTML = '<span class="dot on"></span>Tracking active';
    } catch (e) {
        console.error('MediaPipe init failed:', e);
        statusEl.innerHTML = '<span class="dot off"></span>Tracking failed — idle mode';
    }
}

let lastMPTime = -1;
function runDetection() {
    if (!camReady || !mpReady || !video.videoWidth) return;
    const now = performance.now();
    if (now - lastMPTime < 50) return; // ~20fps cap
    lastMPTime = now;
    try {
        const poseResult = poseLandmarker.detectForVideo(video, now);
        latestPose = poseResult.landmarks?.[0] ?? null;
        const faceResult = faceLandmarker.detectForVideo(video, now);
        latestFace = faceResult.faceBlendshapes?.[0]?.categories ?? null;
    } catch (e) { /* skip frame */ }
}

// ── smoothing helpers ──
const smooth = {};
function ema(key, value, alpha = 0.3) {
    if (!(key in smooth)) smooth[key] = value;
    smooth[key] += (value - smooth[key]) * alpha;
    return smooth[key];
}

// ── drive rig from landmarks ──
let gestureClip = null, gestureTimer = 0;
const gestureLabel = document.getElementById('gestureLabel');

function showGesture(name) {
    gestureLabel.textContent = name;
    gestureLabel.classList.add('show');
    clearTimeout(gestureLabel._to);
    gestureLabel._to = setTimeout(() => gestureLabel.classList.remove('show'), 1500);
}

function detectGesture(pose) {
    if (!pose) return null;
    const lw = pose[15], rw = pose[16], ls = pose[11], rs = pose[12];
    if (!lw || !rw || !ls || !rs) return null;

    // both hands up
    if (lw.y < ls.y - 0.12 && rw.y < rs.y - 0.12 &&
        lw.visibility > 0.6 && rw.visibility > 0.6) return 'excited';

    // right hand wave (above shoulder, moving)
    if (rw.y < rs.y - 0.15 && rw.visibility > 0.6 &&
        lw.y > ls.y - 0.05) return 'wave';

    // left hand wave
    if (lw.y < ls.y - 0.15 && lw.visibility > 0.6 &&
        rw.y > rs.y - 0.05) return 'wave';

    return null;
}

function driveRig(rig, dt) {
    if (!rig) return;
    const pose = latestPose;
    const face = latestFace;
    const s = rig.semantic;

    // gesture detection
    const gesture = detectGesture(pose);
    if (gesture && gesture !== gestureClip) {
        gestureClip = gesture;
        gestureTimer = gesture === 'excited' ? 2.5 : 2.0;
        rig.play(gesture);
        showGesture(gesture === 'wave' ? 'Wave!' : gesture === 'excited' ? 'Excited!' : gesture);
    }
    if (gestureClip) {
        gestureTimer -= dt;
        if (gestureTimer <= 0) {
            gestureClip = null;
            rig.play('idle');
        } else {
            // still let face tracking overlay during gesture
            if (face) driveFace(rig, face);
            rig.update(dt);
            return;
        }
    }

    // no tracking data → idle
    if (!pose) {
        rig.update(dt);
        return;
    }

    rig._driveHips(0, 0, 0);

    // ── head ──
    const nose = pose[0], leftEar = pose[7], rightEar = pose[8];
    if (nose && leftEar && rightEar && nose.visibility > 0.5) {
        const earMidX = (leftEar.x + rightEar.x) / 2;
        const earMidY = (leftEar.y + rightEar.y) / 2;
        const yaw = ema('headYaw', (nose.x - earMidX) * -5, 0.35);
        const pitch = ema('headPitch', (nose.y - earMidY) * 3, 0.35);
        const roll = ema('headRoll', -Math.atan2(rightEar.y - leftEar.y, rightEar.x - leftEar.x) * 1.5, 0.3);
        rig.pose(s.head, pitch, yaw, roll);
    }

    // ── spine ──
    const ls = pose[11], rs = pose[12], lh = pose[23], rh = pose[24];
    if (ls && rs && lh && rh && ls.visibility > 0.4) {
        const shMidX = (ls.x + rs.x) / 2;
        const hiMidX = (lh.x + rh.x) / 2;
        const lean = ema('spineLean', (shMidX - hiMidX) * -3, 0.25);
        // forward/back bend omitted — unreliable with desktop cams (causes lean-back artifact)
        if (s.spine[0]) rig.pose(s.spine[0], 0, 0, lean * 0.6);
        if (s.spine.length > 1) rig.pose(s.spine[s.spine.length - 1], 0, 0, lean * 0.4);
    }

    // ── arms ──
    driveArm(rig, 'L', pose[11], pose[13], pose[15]);
    driveArm(rig, 'R', pose[12], pose[14], pose[16]);

    // ── face (blend shapes) ──
    if (face) driveFace(rig, face);

    // ── tail: gentle wag, faster when moving ──
    const t = rig._t;
    s.tail.forEach((n, i) => rig.pose(n, 0, Math.sin(t * 4 - i * 0.6) * 0.1, 0));

    rig.update(dt);
}

function driveArm(rig, side, shoulder, elbow, wrist) {
    if (!shoulder || !elbow || !wrist) return;
    if (shoulder.visibility < 0.4 || elbow.visibility < 0.3) return;
    const s = rig.semantic;
    const sign = side === 'L' ? -1 : 1;
    const upName = s['upperArm' + side];
    const foName = s['forearm' + side];
    if (!upName || !foName) return;

    const dx = elbow.x - shoulder.x;
    const dy = elbow.y - shoulder.y;
    const dz = (elbow.z - shoulder.z) * 2;

    const pitch = ema(`arm${side}P`, -dy * 2.8, 0.3);
    const roll = ema(`arm${side}R`, -dx * 3 * sign, 0.3);
    const yaw = ema(`arm${side}Y`, dz * 1.5, 0.25);
    rig.pose(upName, pitch, yaw, roll);

    // elbow angle
    const ux = elbow.x - shoulder.x, uy = elbow.y - shoulder.y;
    const fx = wrist.x - elbow.x, fy = wrist.y - elbow.y;
    const dot = ux * fx + uy * fy;
    const cross = Math.abs(ux * fy - uy * fx);
    const angle = ema(`elbow${side}`, Math.max(0.1, Math.atan2(cross, dot)), 0.3);
    rig.poseLocal(foName, angle, 0, 0);
}

function driveFace(rig, blendshapes) {
    const get = (name) => {
        const bs = blendshapes.find(b => b.categoryName === name);
        return bs ? bs.score : 0;
    };

    // blink
    const blinkL = get('eyeBlinkLeft'), blinkR = get('eyeBlinkRight');
    const blink = ema('blink', Math.max(blinkL, blinkR), 0.5);
    rig.blink(blink);

    // mouth
    const jawOpen = get('jawOpen');
    const mouthSmile = (get('mouthSmileLeft') + get('mouthSmileRight')) / 2;
    rig.morph('Mouth Smile', ema('smile', mouthSmile * 1.5, 0.35));
    const openAmt = ema('jawOpen', jawOpen, 0.4);
    if (openAmt > 0.15) {
        rig.viseme('A', Math.min(1, openAmt * 1.8));
    } else {
        rig.viseme('A', 0);
    }

    // brows
    const browUp = (get('browInnerUp') + get('browOuterUpLeft') + get('browOuterUpRight')) / 3;
    const browDown = (get('browDownLeft') + get('browDownRight')) / 2;
    rig.morph('BrowHappy', ema('browHappy', browUp * 1.5, 0.3));
    rig.morph('BrowAngry', ema('browAngry', browDown * 1.2, 0.3));
    rig.morph('BrowSad', ema('browSad', browDown * 0.8, 0.3));
}

// ── main loop ──
const clock = new THREE.Clock();
function animate() {
    const dt = Math.min(clock.getDelta(), 0.05);
    runDetection();
    driveRig(rig, dt);
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

// ── boot ──
async function boot() {
    await loadCharacter('Bluey_fixed_1.glb');
    const hasCam = await startCamera();
    if (hasCam) await initMediaPipe();
    else document.getElementById('loading').style.display = 'none';
    animate();
}
boot();
</script>
</body>
</html>
